services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${rabbitmq_user}"
      RABBITMQ_DEFAULT_PASS: "${rabbitmq_password}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  pg:
    image: postgres
    container_name: stellage-pg
    environment:
      POSTGRES_DB: "${db_name}"
      POSTGRES_USER: "${db_user}"
      POSTGRES_PASSWORD: "${db_password}"
      PGDATA: /var/lib/postgresql/data
    ports:
      - "${db_port}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${db_user} -d ${db_name}"]
      interval: 5s
      timeout: 3s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4
    container_name: stellage-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "${pgadmin_email}"
      PGADMIN_DEFAULT_PASSWORD: "${pgadmin_password}"
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stellage-backend
    command: uvicorn stellage.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      db_host: pg
      redis_host: redis
    volumes:
      - ./backend/src:/app/src
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stellage-celery
    command: celery -A stellage.core.celery_config.celery_app worker -l info
    env_file:
      - backend/.env
    environment:
      db_host: pg
      redis_host: redis
    volumes:
      - ./backend/src:/app/src
    depends_on:
      redis:
        condition: service_healthy
      pg:
        condition: service_healthy

volumes:
  pgdata:
  rabbitmq-data:
  redis:
