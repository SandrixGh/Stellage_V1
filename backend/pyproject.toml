[project]
name = "stellage"
version = "0.1.0"
description = ""
authors = [
    {name = "Alexander Karpov",email = "alexanderak.0501@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard] (>=0.128.0,<0.129.0)",
    "uvicorn[standard] (>=0.40.0,<0.41.0)",
    "websockets (>=14.0,<16.0)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.17.2,<2.0.0)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "bcrypt (==4.0.1)",
    "redis (>=7.1.0,<8.0.0)",
    "celery (>=5.6.1,<6.0.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "aioboto3 (>=15.0.0,<16.0.0)"
]

# Инструменты разработки. Не попадают в прод-образ: Dockerfile ставит
# зависимости через `poetry install --only main`.
[project.optional-dependencies]
dev = [
    "pytest (>=8.4.1,<9.0.0)",
    "ruff (>=0.14.10,<0.15.0)",
]

[tool.poetry]
packages = [{include = "stellage", from = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
app = "stellage.main:start"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Миграции генерируются из шаблона alembic (Union[...] в аннотациях, импорты
# «на всякий случай»). Приводить их к стилю — churn в уже применённых на БД
# файлах ради нуля пользы.
extend-exclude = ["src/stellage/database/alembic/versions"]

[tool.ruff.lint]
# Дефолт ruff (E4/E7/E9 + F) плюс:
#   I  — порядок импортов,
#   B  — bugbear, ловит настоящие ошибки (мутабельные дефолты, потерянный
#        контекст исключения),
#   UP — устаревшие конструкции для целевой версии Python.
# Именно F поймал неимпортированный delete в boxes/templates/repositories.py.
# Набор намеренно узкий: правила должны быть обязательными в CI, а не
# игнорируемым шумом.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# B008 запрещает вызовы в значениях по умолчанию — но для FastAPI это штатный
# способ объявить зависимость, и вызов происходит один раз при сборке роута,
# а не при каждом запросе.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# Реэкспорты моделей/энумов для удобного импорта пакетом.
"src/stellage/database/models/__init__.py" = ["F401"]
"src/stellage/database/enums/__init__.py" = ["F401"]
# Схемы ссылаются друг на друга по кругу (полка знает о коробках, коробка о
# полке). Штатный приём pydantic: строковая аннотация, импорт в конце модуля,
# затем model_rebuild(). Поднять такой импорт наверх — вернуть цикл, поэтому
# E402 здесь не нарушение, а условие работоспособности.
"src/stellage/apps/*/schemas.py" = ["E402"]
"src/stellage/apps/*/*/schemas.py" = ["E402"]